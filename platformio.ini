; PlatformIO Project Configuration
;
; The repo is dual-build: the same sources compile under both Arduino IDE 2
; and PlatformIO. See README.md for the trade-off and per-build setup.
;
; Layout:
;   Pala_One_2_1/Pala_One_2_1.ino    — Arduino-IDE entry, also compiled by PIO
;   Pala_One_2_1/pala_api.h          — public app API headers
;   Pala_One_2_1/pala_app.h
;   Pala_One_2_1/src/                — firmware modules
;   Pala_One_2_1/partitions.csv      — partition table

[platformio]
src_dir = Pala_One_2_1
default_envs = wireless-paper-v1_2

[env]
; pioarduino fork — ships arduino-esp32 3.x (IDF 5.x), matching the Arduino IDE
; default. The classic platformio/espressif32 registry build is still on
; IDF 4.4, which breaks ext0 wake after deep sleep.
; Pinned to 55.03.38-1 (arduino-esp32 3.3.8 / IDF 5.5.4) for reproducibility.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = Pala_One_2_1/partitions.csv
board_build.filesystem = littlefs

; Exclude fonts/ — those .c files are #included as text by src/fonts_data.c.
; Compiling them directly would produce duplicate-symbol errors.
build_src_filter = +<**> -<fonts/**>

lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git#v4.6.0
  adafruit/Adafruit GFX Library @ 1.12.6
  olikraus/U8g2_for_Adafruit_GFX @ 1.8.0

[env:wireless-paper-v1_2]
build_flags =
  -D WIRELESS_PAPER
  -D DISPLAY_V1_2

[env:wireless-paper-v1_1]
build_flags =
  -D WIRELESS_PAPER
  -D DISPLAY_V1_1
