; Pala One Firmware — PlatformIO build configuration
;
; Board note: 'heltec_wireless_paper' is not yet in the espressif32 platform board
; registry, so we use 'heltec_wifi_lora_32_V3' (same ESP32-S3 MCU, same Heltec
; platform).  The display pin layout comes from EInkDisplay_WirelessPaperV1_x
; inside heltec-eink-modules, not from the board JSON, so this is safe.
;
; Board variants — select via default_envs or `pio run -e pala_one_v1_1`:
;   BOARD_V1_1  →  EInkDisplay_WirelessPaperV1_1
;   BOARD_V1_2  →  EInkDisplay_WirelessPaperV1_2  (default)

[platformio]
default_envs = pala_one_v1_2
; Source root = the sketch folder so .ino, src/, fonts/, etc. are all visible
src_dir = .

; ─── Shared settings ─────────────────────────────────────────────────────────
[common]
platform  = espressif32
board     = heltec_wifi_lora_32_V3
framework = arduino

; Exclude fonts/ — those .c files are #included as text by src/fonts_data.c.
; Compiling them as separate translation units would cause duplicate-symbol errors.
build_src_filter = +<**> -<fonts/**> -<.pio/**>

; -I. adds the sketch root to the include path so that:
;   #include "src/ui/ui.h"         resolves to Pala_One_2_1/src/ui/ui.h
;   #include "pala_api.h"          resolves to Pala_One_2_1/pala_api.h
build_flags_common =
    -I.
    -Wno-unused-variable
    -Wno-unused-function

board_build.partitions = partitions.csv
monitor_speed  = 115200
upload_speed   = 921600

; Use the same libraries already installed for Arduino IDE — guarantees version compatibility
lib_extra_dirs =
    /Users/ksadowski/Documents/Arduino/libraries
    /Users/ksadowski/Library/Arduino15/libraries

lib_ldf_mode = chain+

; ─── Board V1.2 (default) ────────────────────────────────────────────────────
[env:pala_one_v1_2]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
build_flags =
    ${common.build_flags_common}
    -DBOARD_V1_2
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
lib_ldf_mode  = ${common.lib_ldf_mode}

; ─── Board V1.1 ──────────────────────────────────────────────────────────────
[env:pala_one_v1_1]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
build_flags =
    ${common.build_flags_common}
    -DBOARD_V1_1
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
lib_ldf_mode  = ${common.lib_ldf_mode}
